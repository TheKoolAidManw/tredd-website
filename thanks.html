<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message sent — TREDD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75;
      --green-mid: #0F6E56;
      --bg: #000;
      --text: #f5f5f7;
      --text-2: rgba(245,245,247,.65);
      --border: rgba(255,255,255,.1);
      --ff: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      font-family: var(--ff);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .card {
      max-width: 440px;
      padding: 48px 40px;
      border-radius: 20px;
      border: .5px solid var(--border);
      background: #111;
    }
    .icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(29,158,117,.15);
      color: var(--green);
      display: grid; place-items: center;
      font-size: 28px; margin: 0 auto 24px;
    }
    h1 {
      font-size: 28px; font-weight: 600;
      letter-spacing: -.03em; margin-bottom: 12px;
    }
    p { font-size: 16px; color: var(--text-2); line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: var(--green); color: #fff;
      padding: 13px 28px; border-radius: 980px;
      font-size: 15px; font-weight: 500;
      text-decoration: none; transition: background .2s;
    }
    .btn:hover { background: var(--green-mid); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Message sent</h1>
    <p>Thanks for reaching out. We'll read your message and get back to you at the email you provided.</p>
    <a href="index.html" class="btn">Back to TREDD</a>
  </div>
</body>
</html>
